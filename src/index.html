<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e85d3f"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"><title>RED Interview · Knowledge Quiz</title></head><body><main><header><div class="bar-top"><div class="eyebrow">STUDY DECK / AUDIO &amp; COMMUNITY</div><div class="lang-switch" role="group" aria-label="Language"><button id="lang-de" class="lang" data-lang="de">DE</button><button id="lang-en" class="lang" data-lang="en">EN</button></div></div><h1>RED Interview<br><em data-i18n="title">Knowledge Quiz</em></h1><p id="sub" data-i18n="sub">Source-based. Repeatable. Offline.</p></header><section id="setup" class="panel"><div class="stats"><strong id="count">—</strong><span data-i18n="countLabel">questions in the collection</span></div><label data-i18n="topicLabel">Topic<select id="topic"><option value="all" data-i18n="allTopics">All topics</option></select></label><button id="start"><span data-i18n="startBtn">Start quiz</span> <span>→</span></button><p class="note" data-i18n="note">Wrong answers return at the end of the round. The first attempt counts toward your result.</p></section><section id="quiz" class="panel hidden"><div class="top"><span id="progress"></span><span id="score"></span></div><div class="bar"><i id="bar"></i></div><div id="card"></div><div id="feedback"></div><button id="next" class="hidden"><span data-i18n="nextBtn">Next</span> <span>→</span></button></section><section id="done" class="panel hidden"><div class="done-mark">✓</div><h2 data-i18n="doneTitle">Round complete.</h2><p id="result"></p><button id="again"><span data-i18n="againBtn">Again</span> <span>↻</span></button></section><p id="error" class="error hidden"></p><button id="retry" class="hidden" data-i18n="retryBtn">Reload ↻</button></main><script src="./app.js"></script></body></html>
